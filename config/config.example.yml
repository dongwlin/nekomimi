nickname:
  - "your_bot_nickname"
command_prefix: "/"
super_users:
  - 123456789

llm:
  enabled: false
  api: "https://api.anthropic.com" # Anthropic-compatible API base URL
  key: "your_api_key"
  model: "gpt-4.1-mini"
  timeout_ms: 30000
  thinking:
    type: "adaptive" # disabled | enabled | adaptive
    budget_tokens: 2048 # only used when type=enabled; must be >= 1024 and < max_tokens
  output_config:
    effort: "medium" # only used when type=adaptive; low | medium | high | max
  show_reasoning: false
  system_prompt: "your custom prompt appended after built-in system prompt"
  context_max: 8000
  context_assembly:
    recent_chat_limit: 50
    recent_diary_limit: 50
  tools:
    enabled: true
    max_result_chars: 4000
  mcp:
    enabled: false
    default_timeout_ms: 10000
    max_payload_bytes: 262144
    servers: []
  tool_loop:
    max_steps: 8
    timeout_ms: 45000
  immersive:
    runtime_buffer:
      max_messages: 200
    flush_policy:
      min_batch_wait_ms: 600
      max_batch_wait_ms: 3000
      max_batch_size: 15
    poke_reaction:
      window_ms: 180000
      mild_threshold: 3
      annoyed_threshold: 6
    scheduler:
      post_reply_delay_ms: 8000
      strong_call_min_delay_ms: 200
      followup_wait_ms: 90000
      cold_open_min_interval_ms: 600000
      quiet_threshold_ms: 300000

repeat:
  enabled: false
  flush_policy:
    min_batch_wait_ms: 600
    max_batch_wait_ms: 3000
    max_batch_size: 15

driver:
  websocket:
    url: "ws://localhost:3001"
    token: "your_access_token"

api:
  enabled: false
  listen: "127.0.0.1:8080"
  auth:
    passphrase: "" # optional/deprecated: first startup auto-generates and logs passphrase, then persists in data/auth.db
    paseto_key_hex: "" # optional: if empty, startup auto-generates a v4 local key and persists it in data/auth.db; if set, config value is synced to DB
    access_ttl_ms: 900000
    refresh_ttl_ms: 604800000
  cors:
    allow_origins:
      - "http://localhost:5173"
