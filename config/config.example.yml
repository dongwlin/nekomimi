nickname:
  - "your_bot_nickname"
command_prefix: "/"
super_users:
  - 123456789
llm:
  enabled: false
  provider: "responses" # responses | openai | gemini(未实现)
  api: "https://api.openai.com/v1/responses"
  key: "your_api_key"
  model: "gpt-4.1-mini"
  system_prompt: "你的自定义提示词（会追加在内置系统提示词后）" # 支持文件引用：{{file:相对路径}}，相对 config.yml 所在目录解析
  history_max: 10 # 多轮对话保留的轮数（每轮=一问一答），<=0 不限制
  context_max: 8000 # 模型上下文上限（token 估算），<=0 不启用压缩
  immersive:
    cooldown_min_ms: 800 # 冷静期下限（毫秒）
    cooldown_max_ms: 3500 # 冷静期上限（毫秒）
    cooldown_base_ms: 1200 # 群聊基准冷静期（毫秒）
    private_base_ms: 200 # 私聊基准冷静期（毫秒）
    window_ms: 5000 # 动态判定窗口（毫秒）
    jitter_ms: 200 # 随机抖动范围（毫秒）
    max_batch_messages: 10 # 单次合并最大消息数
    max_batch_chars: 1200 # 单次合并最大字数（按 rune 计）
    immediate_delay_ms: 120 # 被@或问题触发的最小延迟（毫秒）
    speak_gate:
      enabled: true # 是否启用“是否值得发言”门控
      threshold: 3 # 发言评分阈值，分数达到后才进入后续仲裁
      suppress_after_bot_reply_ms: 2500 # bot 刚回复后，在该窗口内更保守
      max_consecutive_bot_turns: 1 # 连续回复轮次上限，超过后优先抑制
      judge:
        enabled: false # 是否启用“发言判定助手”（用于边界场景裁决）
        model: "" # 判定模型名，空则复用主模型
        prompt: "" # 判定提示词，支持 {{file:prompts/speak_gate_judge.txt}}；空则使用内置默认
        timeout_ms: 1200 # 判定超时（毫秒）
        fail_open: true # 判定失败时是否回退到规则结果（true=回退规则，false=保守不发言）
    mention_judge:
      enabled: false # 被@时是否调用判定助手决定秒回
      model: "" # 判定模型名，空则复用主模型
      prompt: "" # 判定提示词，支持 {{file:prompts/mention_judge.txt}}；空则使用内置默认
      timeout_ms: 1200 # 判定超时（毫秒）
    post_cooldown_judge:
      enabled: false # 冷静期结束后是否二次仲裁（回复/短续冷/长续冷）
      model: "" # 判定模型名，空则复用主模型
      prompt: "" # 判定提示词，支持 {{file:prompts/post_cooldown_judge.txt}}；空则使用内置默认
      timeout_ms: 1200 # 判定超时（毫秒）
      short_wait_ms: 1200 # 短续冷时长（毫秒）
      long_wait_ms: 5000 # 长续冷时长（毫秒）
      max_rounds: 3 # 最大连续续冷轮次，超过后强制回复
      fail_open: true # 判定失败时是否直接放行回复
driver:
  websocket:
    url: "ws://localhost:3001"
    token: "your_access_token"
