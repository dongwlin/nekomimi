nickname:
  - "your_bot_nickname"
command_prefix: "/"
super_users:
  - 123456789

llm:
  enabled: false
  provider: "responses" # responses | openai | gemini (not implemented)
  api: "https://api.openai.com/v1/responses"
  key: "your_api_key"
  model: "gpt-4.1-mini"
  timeout_ms: 30000
  reasoning_effort: "medium" # minimal | low | medium | high
  thinking_type: "" # enabled | disabled | auto
  show_reasoning: false
  system_prompt: "your custom prompt appended after built-in system prompt"
  context_max: 8000
  context_assembly:
    recent_chat_limit: 50
    recent_diary_limit: 50
  tools:
    enabled: true
    max_result_chars: 4000
  mcp:
    enabled: false
    default_timeout_ms: 10000
    max_payload_bytes: 262144
    servers: []
  tool_loop:
    max_steps: 8
    timeout_ms: 45000
  immersive:
    runtime_buffer:
      max_messages: 200
    poke_reaction:
      window_ms: 180000
      mild_threshold: 3
      annoyed_threshold: 6

driver:
  websocket:
    url: "ws://localhost:3001"
    token: "your_access_token"

api:
  enabled: false
  listen: "127.0.0.1:8080"
  auth:
    passphrase: "" # optional/deprecated: first startup auto-generates and logs passphrase, then persists in data/auth.db
    paseto_key_hex: "32_bytes_hex_for_v4_local_key"
    access_ttl_ms: 900000
    refresh_ttl_ms: 604800000
  cors:
    allow_origins:
      - "http://localhost:5173"
