nickname:
  - "your_bot_nickname"
command_prefix: "/"
super_users:
  - 123456789
llm:
  enabled: false
  provider: "responses" # responses | openai | gemini(未实现)
  api: "https://api.openai.com/v1/responses"
  key: "your_api_key"
  model: "gpt-4.1-mini"
  timeout_ms: 30000 # 主请求超时（毫秒，<=0 使用默认 30000）
  reasoning_effort: "medium" # 推理强度：minimal | low | medium | high；留空表示关闭
  thinking_type: "" # 思考类型：enabled | disabled | auto；留空表示不传 thinking 对象
  show_reasoning: false # 是否在日志中记录响应中返回的思考过程/思考摘要（仅当上游返回该字段时生效）
  system_prompt: "你的自定义提示词（会追加在内置系统提示词后）" # 支持文件引用：{{file:相对路径}}，相对 config.yml 所在目录解析
  history_max: 10 # 多轮对话保留的轮数（每轮=一问一答），<=0 不限制
  context_max: 8000 # 模型上下文上限（token 估算），<=0 不启用压缩
  immersive:
    max_batch_messages: 10 # 单次合并最大消息数
    max_batch_chars: 1200 # 单次合并最大字数（按 rune 计）
    immediate_delay_ms: 120 # 同轮 in-flight 时的重试延迟（毫秒）
    # 预生成重生上限固定为 3 次/轮（收到新消息会取消并重生，超过上限后不再重生）
    timeline:
      max_messages: 200 # 会话时间线上限（达到后开始压缩旧消息）
      overflow_messages: 50 # 允许额外超限缓存（避免频繁压缩）
      compress_batch: 100 # 每次压缩最早消息条数（旧摘要会并入下次压缩）
    continuous_speech:
      enabled: true # 是否启用流式连续发言（更像真人逐条回复）
      min_chunk_chars: 12 # 每条最小分段字数（不足会继续积累）
      max_chunk_chars: 80 # 每条最大分段字数（超过将强制切段）
      min_interval_ms: 300 # 连续发言最小间隔（毫秒）
      max_interval_ms: 900 # 连续发言最大间隔（毫秒）
      require_stream: false # 流式失败是否禁止降级（true=不降级，false=降级为单条回复）
    speak_gate:
      enabled: false # 是否启用“发言判定助手”（用于边界场景裁决）
      model: "" # 判定模型名，空则复用主模型
      prompt: "" # 判定提示词，支持 {{file:prompts/speak_gate_judge.txt}}；空则使用内置默认。输出应为 REPLY / SKIP / WAIT:<ms<=3000>
      timeout_ms: 1200 # 判定超时（毫秒）
      reasoning_effort: "none" # 判定助手推理强度：none | minimal | low | medium | high（none=不推理，不继承全局）
      thinking_type: "" # 判定助手思考类型：enabled | disabled | auto；留空表示不传 thinking（不继承全局）
      fail_open: true # 判定失败时是否放行（true=放行发言，false=保守不发言）
driver:
  websocket:
    url: "ws://localhost:3001"
    token: "your_access_token"
